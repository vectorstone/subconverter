# /api/ 覆盖门户首屏并发（短链列表 + 用量 + 管理员查询）以及
# 撤销/刷新后的紧跟重载：10r/m + burst=5 在正常操作下必然误伤，
# 超限默认回 503 HTML，前端又原样展示，表现为“操作后满屏 503”。
# 放宽到 60r/m + burst=20，同时在 location 中用 limit_req_status 429
# 让限流与真实故障可区分。
limit_req_zone $binary_remote_addr zone=subconverter_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=subconverter_read:10m rate=60r/m;
