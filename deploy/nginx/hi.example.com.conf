upstream subconverter_shortlink {
    server 127.0.0.1:15052;
    keepalive 16;
}

# Enable only after shortlink-access-auth has been configured and started.
upstream subconverter_access_auth {
    server 127.0.0.1:15053;
    keepalive 4;
}

# Cloudflare Access must protect the Web UI and /api/*, while bypassing /s/*,
# /sub and /version so subscription clients and health checks can fetch them.

server {
    listen 80;
    listen [::]:80;
    server_name hi.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hi.example.com;

    # Existing wildcard Cloudflare Origin Certificate covers *.example.com.
    ssl_certificate /etc/ssl/cloudflare/api.example.com.crt;
    ssl_certificate_key /etc/ssl/cloudflare/api.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_prefer_server_ciphers off;

    client_max_body_size 128k;
    large_client_header_buffers 4 32k;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    location = /_shortlink_access_verify {
        internal;
        proxy_pass http://subconverter_access_auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header Cf-Access-Authenticated-User-Email "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 1s;
        proxy_read_timeout 6s;
    }

    location = /version {
        proxy_pass http://subconverter_shortlink;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control no-store always;
    }

    location = /app.js {
        proxy_pass http://subconverter_shortlink;
        proxy_set_header Host $host;
        add_header Cache-Control no-store always;
    }

    location = /app.css {
        proxy_pass http://subconverter_shortlink;
        proxy_set_header Host $host;
        add_header Cache-Control no-store always;
    }

    location /api/ {
        auth_request /_shortlink_access_verify;
        auth_request_set $shortlink_verified_email $upstream_http_x_verified_email;
        limit_req zone=subconverter_api burst=5 nodelay;
        proxy_pass http://subconverter_shortlink;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_set_header Cf-Access-Authenticated-User-Email $shortlink_verified_email;
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_set_header Cookie "";
        proxy_buffering off;
        add_header Cache-Control no-store always;
    }

    location /s/ {
        limit_req zone=subconverter_read burst=20 nodelay;
        proxy_pass http://subconverter_shortlink;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        add_header Cache-Control no-store always;
    }

    location /sub {
        limit_req zone=subconverter_read burst=20 nodelay;
        proxy_pass http://subconverter_shortlink;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        add_header Cache-Control no-store always;
    }

    location / {
        proxy_pass http://subconverter_shortlink;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
