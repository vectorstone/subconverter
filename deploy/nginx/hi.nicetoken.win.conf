upstream subconverter_shortlink {
    server 127.0.0.1:15052;
    keepalive 16;
}

# Cloudflare Access must protect the Web UI and /api/*, while bypassing /s/*,
# /sub and /version so subscription clients and health checks can fetch them.

server {
    listen 80;
    listen [::]:80;
    server_name hi.nicetoken.win;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hi.nicetoken.win;

    # Existing wildcard Cloudflare Origin Certificate covers *.nicetoken.win.
    ssl_certificate /etc/ssl/cloudflare/api.nicetoken.win.crt;
    ssl_certificate_key /etc/ssl/cloudflare/api.nicetoken.win.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_prefer_server_ciphers off;

    client_max_body_size 128k;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    location = /version {
        proxy_pass http://subconverter_shortlink;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control no-store always;
    }

    location = /app.js {
        proxy_pass http://subconverter_shortlink;
        proxy_set_header Host $host;
        add_header Cache-Control no-store always;
    }

    location = /app.css {
        proxy_pass http://subconverter_shortlink;
        proxy_set_header Host $host;
        add_header Cache-Control no-store always;
    }

    location /api/ {
        limit_req zone=subconverter_api burst=5 nodelay;
        proxy_pass http://subconverter_shortlink;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        add_header Cache-Control no-store always;
    }

    location /s/ {
        limit_req zone=subconverter_read burst=20 nodelay;
        proxy_pass http://subconverter_shortlink;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        add_header Cache-Control no-store always;
    }

    location /sub {
        limit_req zone=subconverter_read burst=20 nodelay;
        proxy_pass http://subconverter_shortlink;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        add_header Cache-Control no-store always;
    }

    location / {
        proxy_pass http://subconverter_shortlink;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
