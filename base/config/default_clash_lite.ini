[custom]
; Lite Clash config for clients sharing the Clash rule-provider format:
; Clash Verge, FlClash, and Clash Mi.
; Runtime path: config/default_clash_lite.ini
;
; Keep all providers remote and native to Clash's domain/ipcidr/classical
; formats. This deliberately avoids local rules, converted rulesets, URL-REGEX,
; and USER-AGENT collections so the generated profile remains portable.
; Loyalsoldier/clash-rules release branch: about 37k payload entries across
; the providers below as checked on 2026-09-07, substantially below 155k.

; Proxy traffic first. The proxy domain provider includes the maintained GFW
; domain set, so a separate overlapping GFW provider is unnecessary.
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,z.ai
ruleset=🚀 节点选择,clash-domain:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt
ruleset=🚀 节点选择,clash-ipcidr:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/telegramcidr.txt

; Direct only universally useful local/private traffic and a compact process
; rule provider. Mainland addresses are handled by the IP provider and GEOIP.
; These few inline entries preserve the fork's maintained direct exceptions
; without expanding the large repository-local rule corpus.
ruleset=DIRECT,[]DOMAIN-SUFFIX,51ping.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,sankuai.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,dianping.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,dpfile.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,meituan.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,nicehouse.cc
ruleset=DIRECT,[]DOMAIN-SUFFIX,douyin.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,douyinpic.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,douyinstatic.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,iesdouyin.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,alipan.com
ruleset=DIRECT,clash-domain:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt
ruleset=DIRECT,clash-classic:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/applications.txt
ruleset=DIRECT,clash-ipcidr:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt
ruleset=DIRECT,[]GEOIP,CN,no-resolve
ruleset=🚀 节点选择,[]FINAL

; Keep the chain selector contract used by the full default config.
custom_proxy_group=ChainProxyEntry`select`[]♻️ 自动选择`.*
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

enable_rule_generator=true
overwrite_original_rules=true
clash_rule_base=base/clash_dns_base.yml
