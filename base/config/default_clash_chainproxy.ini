
[custom]
; Built-in default Clash config for the ChainProxyEntry selector workflow.
; Runtime path: config/default_clash_chainproxy.ini
; Source repo path: base/config/default_clash_chainproxy.ini

; 先放必须代理或应优先代理的常见国外规则，避免后续直连白名单误命中
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,xn--ngstr-lra8j.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,services.googleapis.cn
ruleset=🚀 节点选择,rules/ACL4SSR/Clash/Ruleset/GoogleCNProxyIP.list
ruleset=🚀 节点选择,clash-domain:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt
ruleset=🚀 节点选择,clash-domain:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/gfw.txt
ruleset=🚀 节点选择,clash-ipcidr:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/telegramcidr.txt
; 广告拦截
ruleset=REJECT,rules/ACL4SSR/Clash/BanAD.list
ruleset=REJECT,rules/ACL4SSR/Clash/BanProgramAD.list
; 局域网 / 私有域名
ruleset=DIRECT,rules/LocalAreaNetwork.list
ruleset=DIRECT,clash-domain:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt
ruleset=DIRECT,clash-classic:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/applications.txt
; 直连白名单：在原 ACL4SSR 基础上补一层更完整的可直连域名集
ruleset=DIRECT,rules/ACL4SSR/Clash/UnBan.list
ruleset=DIRECT,clash-domain:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt
ruleset=DIRECT,rules/ACL4SSR/Clash/ChinaDomain.list
ruleset=DIRECT,rules/ACL4SSR/Clash/ChinaMedia.list
ruleset=DIRECT,rules/ACL4SSR/Clash/Ruleset/PublicDirectCDN.list
ruleset=DIRECT,rules/ACL4SSR/Clash/Ruleset/Alibaba.list
ruleset=DIRECT,rules/ACL4SSR/Clash/Ruleset/Baidu.list
ruleset=DIRECT,rules/ACL4SSR/Clash/Ruleset/Bilibili.list
ruleset=DIRECT,rules/ACL4SSR/Clash/Ruleset/ByteDance.list
ruleset=DIRECT,rules/ACL4SSR/Clash/Ruleset/DiDi.list
ruleset=DIRECT,rules/ACL4SSR/Clash/Ruleset/HuaWei.list
ruleset=DIRECT,rules/ACL4SSR/Clash/Ruleset/JD.list
ruleset=DIRECT,rules/ACL4SSR/Clash/Ruleset/Kuaishou.list
ruleset=DIRECT,rules/ACL4SSR/Clash/Ruleset/Meitu.list
ruleset=DIRECT,rules/ACL4SSR/Clash/Ruleset/NetEase.list
ruleset=DIRECT,rules/ACL4SSR/Clash/Ruleset/PDD.list
ruleset=DIRECT,rules/ACL4SSR/Clash/Ruleset/Sina.list
ruleset=DIRECT,rules/ACL4SSR/Clash/Ruleset/SohuSogo.list
ruleset=DIRECT,rules/ACL4SSR/Clash/Ruleset/Tencent.list
; 自定义国内直连补充 + 中国大陆 IP 兜底
ruleset=DIRECT,rules/meituan.list
ruleset=DIRECT,clash-ipcidr:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt
ruleset=DIRECT,[]GEOIP,CN,no-resolve
ruleset=🚀 节点选择,[]FINAL

custom_proxy_group=ChainProxyEntry`select`[]♻️ 自动选择`.*
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

enable_rule_generator=true
overwrite_original_rules=true
clash_rule_base=base/clash_dns_base.yml
